<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Colegio</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="contenedor" style="max-width: 400px; margin-top: 100px;">
        <h1 style="text-align: center;">Acceso al Sistema</h1>
        
        <form id="formulario-login">
            <div style="margin-bottom: 15px;">
                <label>Correo Electrónico:</label>
                <input type="email" id="input-email-login" style="width: 100%; padding: 8px;" required>
            </div>
            <div style="margin-bottom: 15px;">
                <label>Contraseña:</label>
                <input type="password" id="input-password-login" style="width: 100%; padding: 8px;" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Ingresar</button>
        </form>
        <p id="mensaje-error" style="color: red; text-align: center; display: none;">Credenciales incorrectas.</p>
    </div>

    <script src="js/vistas/loginVista.js"></script>
</body>
</html>
