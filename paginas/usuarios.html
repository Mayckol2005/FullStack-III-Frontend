<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Colegio</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="contenedor">
        <h1>Gestión de Usuarios</h1>
        <p>Administración del personal y estudiantes (Conectado a Spring Boot)</p>

        <h2>Registrar Nuevo Usuario</h2>
        <form id="formulario-crear-usuario" class="formulario-usuario" style="display: flex; flex-wrap: wrap; gap: 10px;">
            
            <input type="text" id="input-rut" placeholder="RUT (Ej: 12345678-9)" required>
            <input type="text" id="input-nombre" placeholder="Nombre completo" required>
            <input type="email" id="input-email" placeholder="Correo electrónico" required>
            <input type="password" id="input-password" placeholder="Contraseña (mín 6 caracteres)" required minlength="6">
            
            <select id="select-rol" required>
                <option value="">Seleccione un rol...</option>
                <option value="ADMINISTRADOR">Administrador</option>
                <option value="PROFESOR">Profesor</option>
                <option value="ALUMNO">Alumno</option>
            </select>
            
            <button type="submit" class="btn">Guardar Usuario</button>
        </form>

        <h2>Lista de Usuarios</h2>
        <table>
            <thead>
                <tr>
                    <th class="acciones-col" title="Opciones"><i class="fas fa-cog"></i></th> 
                    <th>ID</th>
                    <th>RUT</th> 
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Contraseña</th> 
                    <th>Rol</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla-usuarios">
                </tbody>
        </table>
    </div>

    <script src="../js/servicios/usuarioServicio.js"></script>
    <script src="../js/vistas/usuarioVista.js"></script>
    <script src="../js/vistas/main.js"></script>
</body>
</html>
